# 웹과 API를 같은 주소로 묶어 CORS가 필요 없게 한다 — 앱은 기본 설정에서 /api 상대 경로로 요청한다.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # compose 네트워크 안의 API 컨테이너(서비스 이름 api)
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 빌드 산출물은 파일 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅 — /health 같은 경로로 새로고침해도 index.html을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
