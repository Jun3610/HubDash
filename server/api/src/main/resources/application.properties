spring.application.name=hubdash-api
server.port=8080
app.api-key=${API_KEY:dev-local-key}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hubdash}
spring.datasource.username=${DB_USER:hubdash}
spring.datasource.password=${DB_PASSWORD:hubdash}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=hubdash-raw-etl
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# 도메인별 raw 이벤트 패키지(domain.<도메인>.event)를 전부 신뢰 — 새 도메인 추가 시 이 프로퍼티를 수정할 필요 없음.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.junyoung.dashboard.domain.*

# Spring Batch 메타데이터 테이블은 다른 도메인 테이블과 동일하게 Flyway(V18)로 관리 — Batch 자체의 자동 초기화는 끈다.
spring.batch.jdbc.initialize-schema=never
# 앱 기동 시 발견된 Job을 자동 실행하는 JobLauncherApplicationRunner를 끈다 — 실행은 스케줄러/수동 트리거로만 한다.
spring.batch.job.enabled=false

# 노션 → 허브 링크 동기화(이슈 #107). 노션 내부 통합 토큰이 없으면 동기화는 꺼진 채로 기동한다.
app.notion.token=${NOTION_TOKEN:}
app.notion.sync-initial-delay=PT30S
app.notion.sync-interval=PT10M
