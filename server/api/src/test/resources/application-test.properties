spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.test.database.replace=none
app.api-key=test-api-key

# KafkaTemplate 빈은 그대로 두되(안 그러면 RawHealthLogService 주입이 실패), 리스너 컨테이너는 자동 시작을 꺼서
# 일반 테스트가 존재하지 않는 브로커에 반복 연결을 시도하지 않게 한다.
# @EmbeddedKafka를 쓰는 테스트는 spring.kafka.listener.auto-startup을 true로 오버라이드해서 다시 켠다.
spring.kafka.listener.auto-startup=false

# 운영(Postgres)에서는 Batch 메타데이터 테이블을 Flyway(V18)로 관리한다. 이 앱은 Boot의 기본
# BatchAutoConfiguration(in-memory ResourcelessJobRepository)을 쓰지 않고 @EnableJdbcJobRepository로
# 직접 JDBC 기반 JobRepository를 활성화하므로, Boot의 spring.batch.jdbc.initialize-schema 프로퍼티는
# 적용되지 않는다(그 프로퍼티는 Boot 자체 BatchAutoConfiguration에만 연결됨) — 테스트 H2는 Flyway도 꺼두므로
# 범용 spring.sql.init으로 spring-batch-core가 제공하는 H2용 스키마 스크립트를 직접 적용한다.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2-batch.sql
