spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.test.database.replace=none
app.api-key=test-api-key

# KafkaTemplate 빈은 그대로 두되(안 그러면 RawHealthLogService 주입이 실패), 리스너 컨테이너는 자동 시작을 꺼서
# 일반 테스트가 존재하지 않는 브로커에 반복 연결을 시도하지 않게 한다.
# @EmbeddedKafka를 쓰는 테스트는 spring.kafka.listener.auto-startup을 true로 오버라이드해서 다시 켠다.
spring.kafka.listener.auto-startup=false
