# Kafka(KRaft 단일 노드) — 로컬 docker-compose와 같은 이미지. 관리형(Confluent Cloud 등)으로 옮기려면 이 파일을
# kustomization에서 빼고 app의 KAFKA_BOOTSTRAP만 바꾸면 된다.
#
# advertised 주소는 파드 DNS(kafka-0.kafka...)로 고정한다. Service를 통해 자기 자신에 접속하는 구조로 만들면
# 준비되기 전에는 엔드포인트가 없어서 컨트롤러 쿼럼이 형성되지 못하는 닭-달걀 문제가 생기므로,
# 헤드리스 Service에 publishNotReadyAddresses를 켜서 준비 전에도 DNS가 풀리게 한다.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: hubdash
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: hubdash
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        # apache/kafka 이미지는 uid 1000(appuser)로 실행 — PVC에 쓰기 권한을 준다.
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.hubdash.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.hubdash.svc.cluster.local:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
