# Postgres 백업 — 매일 pg_dump를 별도 PVC에 저장하고 최근 7개만 보관한다.
# 같은 노드의 디스크라서 노드 자체가 사라지는 사고는 막지 못한다(실수로 DB를 지우거나 손상시킨 경우를 위한 백업).
# 노드 밖으로 복사하는 것은 README의 "백업/복원" 참고.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: hubdash
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: hubdash
spec:
  schedule: "30 3 * * *"
  # 이전 백업이 끝나기 전에 다음 백업이 시작되어 같은 볼륨을 동시에 쓰는 일을 막는다.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:16
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: hubdash-secrets
                      key: DB_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts=$(date +%Y%m%d-%H%M%S)
                  tmp="/backup/.hubdash-${ts}.dump.tmp"
                  # 덤프가 중간에 실패해도 부분 파일이 백업으로 남지 않도록 임시 파일에 쓰고, 성공했을 때만 이름을 바꾼다.
                  trap 'rm -f "$tmp"' EXIT
                  pg_dump -h postgres -U hubdash -Fc hubdash > "$tmp"
                  [ -s "$tmp" ] || { echo "빈 덤프 — 실패로 처리"; exit 1; }
                  mv "$tmp" "/backup/hubdash-${ts}.dump"
                  echo "백업 완료: hubdash-${ts}.dump ($(du -h "/backup/hubdash-${ts}.dump" | cut -f1))"
                  # 최근 7개만 보관
                  ls -1t /backup/hubdash-*.dump | tail -n +8 | xargs -r rm -f --
                  echo "보관 중인 백업: $(ls -1 /backup/hubdash-*.dump | wc -l)개"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
